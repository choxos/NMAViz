<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#cfccc4" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Visualize the evidence structure of a network meta-analysis. Upload your data and read the network as an electrical circuit, a flow of evidence, a random walk, a diffusion, and more."
    />
    <title>NMAViz | Reading the network in a network meta-analysis</title>
  </head>
  <body>
    <script>
      // Resolve the theme before the first paint, so nobody sees the palette
      // change under them. The stored choice wins; otherwise the paper theme,
      // which is the one the machine is drawn in and the default on purpose
      // rather than by whatever the system happens to be set to.
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("nmaviz-theme");
        } catch {}
        if (!["dark", "light", "mono", "arcade"].includes(theme)) theme = "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
