<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;550;600;620;650;750&display=swap">
  <style>
    body { margin: 0; font-family: Inter, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #2f5a8c; } a:hover { color: #23345e; }
    .panel { background: #fffffff2; border: 1px solid #1724361f; border-radius: 15px; box-shadow: 0 1px 2px #2433440a, 0 2px 6px #24334408, 0 18px 48px #2433440d; }
    .kicker { font-size: 9.5px; font-weight: 650; letter-spacing: 0.12em; text-transform: uppercase; color: #8b949d; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 13px; background: #fff; }
    .row dt { font-size: 11px; font-weight: 600; color: #67727c; }
    .row dd { margin: 0; font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }
    .lens { border: 0; background: none; color: #67727c; border-radius: 11px; padding: 10px 12px; font: 550 12px Inter, sans-serif; display: flex; align-items: center; gap: 6px; white-space: nowrap; min-height: 44px; box-sizing: border-box; }
    .lens.on { background: #23345e; color: #f4f6fb; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #f2f1ee; color: #191d24; overflow: hidden">

  <svg viewBox="0 0 390 320" style="position: absolute; left: 0; top: 0; width: 390px; height: 320px">
    <g stroke="#7a8794" stroke-linecap="round" fill="none">
      <path d="M60 176 L128 132" stroke-width="4"/>
      <path d="M60 176 L152 212" stroke-width="2"/>
      <path d="M128 132 L215 232" stroke-width="5"/>
      <path d="M215 232 L152 212" stroke-width="5.6"/>
      <path d="M215 232 L206 190" stroke-width="6.4"/>
      <path d="M215 232 L176 276" stroke-width="3.6"/>
      <path d="M215 232 L318 214" stroke-width="1.8"/>
      <path d="M215 232 L238 108" stroke-width="2.6"/>
    </g>
    <path d="M60 176 L152 212" stroke="#b4653a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="176" r="10" fill="#23345e" stroke="#23345e" stroke-width="1.8"/>
    <text x="60" y="156" text-anchor="middle" font-size="11" font-weight="650" fill="#191d24">acar</text>
    <circle cx="152" cy="212" r="10" fill="#23345e" stroke="#23345e" stroke-width="1.8"/>
    <text x="140" y="234" text-anchor="end" font-size="11" font-weight="650" fill="#191d24">metf</text>
    <circle cx="215" cy="232" r="18" fill="#fff" stroke="#23345e" stroke-width="1.8"/>
    <text x="215" y="262" text-anchor="middle" font-size="11" font-weight="550" fill="#3b4652">plac</text>
    <circle cx="206" cy="190" r="13" fill="#fff" stroke="#23345e" stroke-width="1.8"/>
    <circle cx="128" cy="132" r="9" fill="#fff" stroke="#23345e" stroke-width="1.8"/>
    <text x="128" y="115" text-anchor="middle" font-size="11" font-weight="550" fill="#3b4652">sulf</text>
    <circle cx="176" cy="276" r="9" fill="#fff" stroke="#23345e" stroke-width="1.8"/>
    <circle cx="318" cy="214" r="8" fill="#fff" stroke="#23345e" stroke-width="1.8"/>
    <text x="318" y="196" text-anchor="middle" font-size="11" font-weight="550" fill="#3b4652">sita</text>
    <circle cx="238" cy="108" r="8" fill="#fff" stroke="#23345e" stroke-width="1.8"/>
  </svg>

  <div style="position: absolute; left: 14px; top: 14px; max-width: 55vw">
    <div style="display: flex; align-items: center; gap: 9px">
      <span style="display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: #fff; border: 1px solid #1724361f; color: #23345e">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="4.5" r="2.2"/><circle cx="4.8" cy="16" r="2.2"/><circle cx="19.2" cy="16" r="2.2"/><path d="M10.6 6.4 6.2 14.1M13.4 6.4l4.4 7.7M7 16h10"/></svg>
      </span>
      <span style="font-size: 19px; font-weight: 650; letter-spacing: -0.5px; color: #23345e">NMA<span style="font-weight: 450; color: #3b4652">Viz</span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px; margin-top: 9px; font-size: 10px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: #8b949d">
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #b4653a"></span>Diabetes
    </div>
    <h1 style="margin: 8px 0 0; font-size: 21px; font-weight: 620; letter-spacing: -0.7px">Network</h1>
  </div>

  <div style="position: absolute; right: 14px; top: 14px; display: flex; gap: 8px">
    <div class="panel" style="width: 38px; height: 38px; display: grid; place-items: center; color: #3b4652"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v13c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-13M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg></div>
    <div class="panel" style="width: 38px; height: 38px; display: grid; place-items: center; color: #3b4652"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg></div>
  </div>

  <aside class="panel" style="position: absolute; left: 10px; right: 10px; bottom: 196px; padding: 15px">
    <div class="kicker">Comparison</div>
    <h2 style="margin: 6px 0 0; font-size: 19px; font-weight: 620; letter-spacing: -0.4px">acar <span style="color: #8b949d; font-weight: 450">vs</span> metf</h2>
    <p style="margin: 6px 0 0; font-size: 11px; color: #67727c">Mean difference in HbA1c, percentage points</p>
    <dl style="margin: 14px 0 0; display: flex; flex-direction: column; gap: 1px; background: #17243612; border: 1px solid #1724361f; border-radius: 11px; overflow: hidden">
      <div class="row"><dt>Network</dt><dd>0.29 (0.06 to 0.51)</dd></div>
      <div class="row"><dt>Direct</dt><dd>0.20 (−0.50 to 0.90)</dd></div>
      <div class="row"><dt>Direct evidence</dt><dd>10.2%</dd></div>
    </dl>
  </aside>

  <div class="panel" style="position: absolute; left: 10px; right: 10px; bottom: 152px; display: flex; justify-content: space-between; padding: 9px 6px">
    <div style="padding: 0 10px; text-align: center; border-right: 1px solid #17243612"><div style="font-size: 9px; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase; color: #8b949d">Treatments</div><div style="margin-top: 3px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">10</div></div>
    <div style="padding: 0 10px; text-align: center; border-right: 1px solid #17243612"><div style="font-size: 9px; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase; color: #8b949d">Comparisons</div><div style="margin-top: 3px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">15</div></div>
    <div style="padding: 0 10px; text-align: center; border-right: 1px solid #17243612"><div style="font-size: 9px; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase; color: #8b949d">Studies</div><div style="margin-top: 3px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">26</div></div>
    <div style="padding: 0 10px; text-align: center"><div style="font-size: 9px; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase; color: #8b949d">Q</div><div style="margin-top: 3px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">97.0</div></div>
  </div>

  <aside class="panel" style="position: absolute; left: 10px; right: 10px; bottom: 68px; padding: 12px">
    <div class="kicker" style="margin-bottom: 7px">Comparison of interest</div>
    <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px">
      <div style="border: 1px solid #1724361f; border-radius: 9px; background: #fff; padding: 11px 9px; font-size: 11.5px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">acar</div>
      <div style="width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid #1724361f; border-radius: 9px; background: #fff; color: #3b4652"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 4 7l3 3M4 7h11a4 4 0 0 1 4 4M17 20l3-3-3-3M20 17H9a4 4 0 0 1-4-4"/></svg></div>
      <div style="border: 1px solid #1724361f; border-radius: 9px; background: #fff; padding: 11px 9px; font-size: 11.5px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">metf</div>
    </div>
  </aside>

  <nav class="panel" style="position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 2px; padding: 4px; overflow: hidden">
    <button class="lens on"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="17" r="2"/><circle cx="19" cy="17" r="2"/><path d="M10.7 6.7 6.3 15.3M13.3 6.7l4.4 8.6M7 17h10"/></svg>Network</button>
    <button class="lens"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><rect x="16" y="4" width="4" height="4" rx="1"/><rect x="16" y="16" width="4" height="4" rx="1"/><path d="M7 6.6 16 7M7 17.4 16 17M7 7.4l9 9.2"/></svg>Trials</button>
    <button class="lens"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h13M12 7l5 5-5 5M18.5 12H21"/></svg>Flow</button>
  </nav>
</div>
</x-dc>
</body>
</html>
